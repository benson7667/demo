# /etc/nginx/sites-enabled/default on the VM
# Apply with:
#   sudo vi /etc/nginx/sites-enabled/default
#   :set paste, gg, dG, i, paste, Esc, :wq
#   sudo nginx -t && sudo systemctl reload nginx

# Drop unknown hosts on :80 (bare IP, random subdomains)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Drop unknown SNI on :443 (https://<ip> → TLS handshake failure, no cert mismatch dialog)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

# bensontoh.com → frontend container on 127.0.0.1:8080
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bensontoh.com www.bensontoh.com;

    ssl_certificate     /etc/letsencrypt/live/bensontoh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bensontoh.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($host = www.bensontoh.com) {
        return 301 https://bensontoh.com$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# :80 → :443 for the apex/www
server {
    listen 80;
    listen [::]:80;
    server_name bensontoh.com www.bensontoh.com;
    return 301 https://bensontoh.com$request_uri;
}
